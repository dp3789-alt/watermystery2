<style>

:root {

  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--fg); font-family: var(--f-ui); font-size: 15px; line-height: 1.6; overflow: hidden; }

#app { height: 100%; display: flex; flex-direction: column; }

.title-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center;
  padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));

.apps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px 6px; }

  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }

/* 공용 그림 도구: 필름 노이즈, 비네트, 번짐. p는 그림마다 다른 id 접두사 */
function fxDefs(p) {
  return `<filter id="${p}grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .6 0"/></filter>
  <filter id="${p}blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="${p}soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter>
  <radialGradient id="${p}vig" cx=".5" cy=".5" r=".72"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".8"/></radialGradient>`;
}
function fxOver(p, w, h, g = .1) {
  return `<g pointer-events="none"><rect width="${w}" height="${h}" fill="url(#${p}vig)"/><rect width="${w}" height="${h}" filter="url(#${p}grain)" opacity="${g}"/></g>`;
}
function rnd(seed) { let r = seed; return () => (r = (r * 9301 + 49297) % 233280) / 233280; }
/* 바닥에 깔리는 부드러운 그림자 */
function shadow(cx, cy, rx, ry, o = .5) { return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#000" opacity="${o}" filter="url(#rsoft)"/>`; }
/* 창밖 건물 불빛 */
function cityLights(seed, n, x0, x1, y0, y1, color, w = 5, h = 4) {
  const r = rnd(seed); let s = "";
  for (let i = 0; i < n; i++) s += `<rect x="${(x0 + r() * (x1 - x0)).toFixed(0)}" y="${(y0 + r() * (y1 - y0)).toFixed(0)}" width="${w}" height="${h}" fill="${color}" opacity="${(0.25 + r() * 0.7).toFixed(2)}"/>`;
  return s;
}
function skyline(seed, x0, x1, base, hmin, hmax, fill) {
  const r = rnd(seed); let s = "", x = x0;
  while (x < x1) { const w = 18 + r() * 34, h = hmin + r() * (hmax - hmin); s += `<rect x="${x.toFixed(0)}" y="${(base - h).toFixed(0)}" width="${(w + 1).toFixed(0)}" height="${h.toFixed(0)}" fill="${fill}"/>`; x += w; }
  return s;
}

function parseT(t) { const m = /^(\d+)\/(\d+)\s+(\d+):(\d+)$/.exec(t || ""); return m ? new Date(YEAR, +m[1] - 1, +m[2], +m[3], +m[4]) : null; }

/* 소리 (WebAudio). 배경음악 없음 (DP 선호) */
let AC = null;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return AC; }
function tone(freq, dur, type = "sine", vol = 0.12, when = 0) {
  const ac = audio(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + when;
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + dur + 0.05);
}
function noise(dur, vol = 0.25, lp = 600) {
  const ac = audio(); if (!ac) return;
  const len = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
  const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = "lowpass"; f.frequency.value = lp; g.gain.value = vol;
  src.buffer = buf; src.connect(f); f.connect(g); g.connect(ac.destination); src.start();
}

  buzz() { tone(110, 0.5, "sawtooth", 0.035); try { navigator.vibrate && navigator.vibrate([120, 60, 120]); } catch (e) {} },
  thud() { tone(55, 0.7, "sine", 0.35); noise(0.25, 0.15, 300); },
  far() { noise(0.9, 0.18, 220); tone(48, 1.1, "sine", 0.2); },
  click() { tone(880, 0.05, "square", 0.03); },
  wrong() { tone(160, 0.25, "triangle", 0.12); },
  open() { tone(660, 0.08, "sine", 0.07); tone(990, 0.12, "sine", 0.06, 0.07); }
};

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 2600); }

/* 목소리: "*" 첫 번째 인격, "-" 두 번째 인격 */
function voiceKind(line) { return line[0] === "*" ? "v1" : line[0] === "-" ? "v2" : line[0] === "「" ? "q" : ""; }
function voiceText(line) { return line[0] === "*" || line[0] === "-" ? line.slice(1) : line; }
function voice(line) {
  S.voiceLog.push({ t: S.time, s: line });
  const box = $("#voice"), el = document.createElement("div");
  el.className = "vl " + voiceKind(line); el.textContent = voiceText(line);
  box.appendChild(el);
  while (box.children.length > 2) box.removeChild(box.firstChild);
  setTimeout(() => el.classList.add("fade"), 6500);
  setTimeout(() => el.remove(), 7200);
}

/* 서술 화면 (암전). lines: 문자열 또는 {blackout, glitch, rename, sfx, phrase, verdict, title, clear} */
function showNarr(lines, done, opts = {}) {
  let el = $("#narr");
  if (!el) { el = document.createElement("div"); el.id = "narr"; document.body.appendChild(el); }
  el.hidden = false; el.className = "";
  el.innerHTML = `<div class="nl"></div><button class="skip" type="button">건너뛰기</button><div class="more" hidden>눌러서 계속 ▸</div>`;
  const nl = $(".nl", el), more = $(".more", el);
  let i = 0, finished = false;
  const finish = () => {
    if (finished) return; finished = true;
    el.onclick = null; document.removeEventListener("keydown", onKey);
    if (opts.keep) { done && done(); return; }
    el.hidden = true; done && done();
  };
  function addLine(text) {
    [...nl.querySelectorAll(".ln")].forEach(n => n.classList.add("old"));
    if (nl.children.length >= 8) nl.removeChild(nl.firstChild);
    const d = document.createElement("div");
    if (text.startsWith("date:")) { d.className = "ln date"; d.textContent = text.slice(5); }
    else { d.className = "ln " + voiceKind(text); d.textContent = voiceText(text); }
    nl.appendChild(d);
  }
  function step() {
    while (i < lines.length) {
      const L = lines[i++];
      if (typeof L === "string") { addLine(L); more.hidden = false; return; }
      if (L.rename) { S.name = L.rename; continue; }
      if (L.sfx) { SFX[L.sfx] && SFX[L.sfx](); continue; }
      if (L.glitch) { el.classList.remove("glitch"); void el.offsetWidth; el.classList.add("glitch"); SFX.thud(); continue; }
      if (L.blackout) { nl.innerHTML = ""; SFX.thud(); continue; }
      if (L.clear) { nl.innerHTML = ""; continue; }
      if (L.phrase) { nl.innerHTML = `<div class="phrase">${esc(L.phrase)}</div>`; more.hidden = false; return; }
      if (L.title) { nl.innerHTML = `<div class="bigtitle"><small>${esc(L.small || "")}</small>${esc(L.title)}</div>`; more.hidden = false; return; }
      if (L.verdict) { nl.innerHTML = verdictHTML(L.verdict); more.hidden = false; return; }
    }
    finish();
  }
  function onKey(e) { if (e.key === " " || e.key === "Enter") { e.preventDefault(); step(); } }
  el.onclick = e => { if (e.target.closest(".skip")) { i = lines.length; step(); return; } if (!e.target.closest(".endbtns")) step(); };
  document.addEventListener("keydown", onKey);
  step();
}
function verdictHTML(v) {
  return `<div class="vpaper"><h5>판결문</h5><dl>
    <dt>피고</dt><dd>${esc(v.who)}</dd><dt>죄목</dt><dd>${esc(v.crime)}</dd>
    <dt>법이 내린 형량</dt><dd>${esc(v.law)}</dd><dt>죗값</dt><dd class="pay">${esc(v.pay)}</dd></dl>
    <div class="sign">심판자<span>審</span></div></div>`;
}
/* 엔딩/실패 마지막 화면: 버튼이 있는 정지 화면 */
function showEndCard(html, buttons) {

function unread(app) {
  const p = S.ph;
  if (app === "msg") return Object.values(p.threads).reduce((a, t) => a + t.unread, 0);
  if (app === "mail") return p.mails.filter(m => !m.read).length;
  if (app === "news") return p.news.filter(m => !m.read).length;
  if (app === "board") return p.board.filter(m => !m.read).length;
  return 0;
}
const totalUnread = () => ["msg", "mail", "news", "board"].reduce((a, k) => a + unread(k), 0);

/* 사건 묶음 하나를 배달한다. 알림은 앱·대화방별로 묶어 최대 4줄 (1편 DP 요청) */
function deliver(batch, after) {
  S.time = batch.t;
  const groups = [], narrs = [], voices = [];
  const group = (key, app, title) => { let g = groups.find(x => x.key === key); if (!g) { g = { key, app, title, lines: [] }; groups.push(g); } return g; };
  for (const it of batch.items) {
    if (it.msg) {
      const p = S.ph; let th = p.threads[it.msg];
      if (!th) { th = p.threads[it.msg] = { name: it.name, msgs: [], unread: 0 }; }
      p.torder = [it.msg, ...p.torder.filter(x => x !== it.msg)];
      const g = group("msg:" + it.msg, "msg", th.name);
      for (const L of it.lines) {
        const me = L.startsWith("나:");
        th.msgs.push({ t: batch.t, me, text: me ? L.slice(2) : L });
        if (!me) { th.unread++; g.lines.push(L); }
      }
    } else if (it.rename) { S.ph.threads[it.rename.thread].name = it.rename.name; }
    else if (it.mails) { HEE_MAILS.forEach(m => S.ph.mails.unshift({ ...m, read: false })); group("mail", "mail", "메일").lines.push(`희주 외 메일 ${HEE_MAILS.length}통`); }
    else if (it.news) { S.ph.news.unshift({ ...it.news, t: batch.t, read: false }); group("news:" + it.news.id, "news", it.news.press).lines.push(it.news.title); }
    else if (it.board) { S.ph.board.unshift({ ...it.board, t: batch.t, read: false }); group("board", "board", "죗값 게시판").lines.push(it.board.title); }
    else if (it.boardOn) { S.ph.boardOn = true; }
    else if (it.voice) voices.push(it.voice);
    else if (it.narr) narrs.push(...it.narr);
  }
  save();
  const finish = () => {
    if (groups.length) { SFX.ping(); SFX.buzz(); notify(groups); }
    voices.forEach((v, k) => setTimeout(() => voice(v), 900 + k * 1800));
    after && after();
  };
  if (narrs.length) showNarr(narrs, finish); else finish();
}

function notify(groups) {
  const box = $("#notif"); box.innerHTML = "";
  for (const g of groups.slice(0, 3)) {
    const m = APP_META[g.app], b = document.createElement("button");
    b.type = "button"; b.className = "nt";
    b.innerHTML = `<span class="ni" style="background:${m.c}">${m.i}</span><span class="nb"><b>${esc(g.title)}<em>${fmtClock(S.time)}</em></b>${g.lines.slice(-4).map(l => `<div>${esc(l)}</div>`).join("")}</span>`;
    b.onclick = () => { box.innerHTML = ""; openPhone(g.app, g.key.split(":")[1] || null); };
    box.appendChild(b);
    const len = g.title.length + g.lines.slice(-4).join("").length;
    const ms = Math.min(14000, 6000 + len * 60);
    setTimeout(() => b.classList.add("fade"), ms);
    setTimeout(() => b.remove(), ms + 600);
  }
}

function head(title) { return `<div class="ph-head"><button data-act="back" type="button">‹ 뒤로</button><b>${esc(title)}</b></div>`; }
function phoneApp() {
  const p = S.ph, a = PV.app, id = PV.id;
  if (a === "msg") {
    if (id && p.threads[id]) {
      const th = p.threads[id]; th.unread = 0;
      let last = "", out = "";
      for (const m of th.msgs) { const d = fmtDate(m.t); if (d !== last) { out += `<div class="day">${d}</div>`; last = d; } out += `<div class="bub ${m.me ? "me" : ""}">${esc(m.text)}<small>${fmtClock(m.t)}</small></div>`; }
      return head(th.name) + `<div class="chat">${out}</div>`;
    }
    const rows = p.torder.map(k => { const th = p.threads[k], m = th.msgs[th.msgs.length - 1];
      return `<button class="ph-row" data-id="${k}" type="button"><span class="u ${th.unread ? "" : "r"}"></span><span class="t"><b>${esc(th.name)}</b><small>${esc(m.text)}</small></span><span class="d">${fmtShort(m.t)}</span></button>`; }).join("");
    return head("메시지") + (rows || `<div class="ph-empty">메시지가 없습니다.</div>`);
  }
  if (a === "mail") {
    if (id != null && p.mails[id]) { const m = p.mails[id]; m.read = true; return head(m.subject) + `<div class="mailbody"><small style="color:var(--muted)">${esc(m.from)} · ${esc(m.date)}</small>\n\n${esc(m.body)}</div>`; }
    return head("받은편지함") + (p.mails.map((m, k) => `<button class="ph-row" data-id="${k}" type="button"><span class="u ${m.read ? "r" : ""}"></span><span class="t"><b>${esc(m.from)} · ${esc(m.subject)}</b><small>${esc(m.body.split("\n")[0])}</small></span><span class="d">${esc(m.date)}</span></button>`).join("") || `<div class="ph-empty">메일이 없습니다.</div>`) +
      (p.mails.length ? `<div class="ph-empty">보낸편지함: 0통</div>` : "");
  }
  if (a === "news" || a === "board") {
    const list = a === "news" ? p.news : p.board;
    const item = id != null ? list.find(n => (n.id || n.title) === id) : null;
    if (item) {
      const first = !item.read; item.read = true;
      if (first && item.voice) setTimeout(() => voice(item.voice), 500);
      const cm = (item.cmts || []).map(c => `<div class="cmt"><small>${esc(c[0])}</small>${esc(c[1])}</div>`).join("");
      return head(a === "news" ? "뉴스" : "죗값 게시판") + `<div class="article"><div class="press">${esc(item.press || item.by)} · ${esc(item.stamp || fmtShort(item.t))}${item.rec ? " · " + esc(item.rec) : ""}</div><h4>${esc(item.title)}</h4><p>${esc(item.body)}</p>${cm ? `<div class="cmts">${cm}</div>` : ""}</div>`;
    }
    return head(a === "news" ? "뉴스" : "죗값 게시판") + (list.map(n => `<button class="ph-row" data-id="${esc(n.id || n.title)}" type="button"><span class="u ${n.read ? "r" : ""}"></span><span class="t"><b>${esc(n.title)}</b><small>${esc(n.press || n.by)}</small></span><span class="d">${esc(n.stamp ? n.stamp.split(" (")[0] : fmtShort(n.t))}</span></button>`).join("") || `<div class="ph-empty">아직 아무것도 없습니다.</div>`);
  }
  return "";
}
function bindPhone(root, inStep) {
  root.querySelectorAll("[data-app]").forEach(b => b.onclick = () => { SFX.click(); PV.app = b.dataset.app; PV.id = null; refreshPhone(); });
  root.querySelectorAll(".ph-row").forEach(b => b.onclick = () => { PV.id = PV.app === "mail" ? +b.dataset.id : b.dataset.id; refreshPhone(); });
  root.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
    const act = b.dataset.act;
    if (act === "back") { if (PV.id != null) PV.id = null; else PV.app = null; refreshPhone(); }
    else if (act === "close") closePhone();
    else if (act === "time") advanceBatch();
    else if (act === "done") stepDone();
  });
}
function refreshPhone() {
  save();
  if (PV.open) { const ov = $(".phone-ov"); if (ov) { ov.innerHTML = phoneHTML(false); bindPhone(ov, false); } updateTopDot(); return; }
  const stage = $(".phone-stage"); if (stage) { stage.innerHTML = phoneHTML(true); bindPhone(stage, true); const t = $(".top"); if (t) { t.outerHTML = topHTML(); bindTop(); } }
}
function openPhone(app, id) {
  PV.app = app || null; PV.id = app === "mail" ? null : (id || null);
  if (SCRIPT[S.step].type === "phone") { refreshPhone(); return; }
  PV.open = true;
  let ov = $(".phone-ov"); if (!ov) { ov = document.createElement("div"); ov.className = "phone-ov"; document.body.appendChild(ov); }
  ov.onclick = e => { if (e.target === ov) closePhone(); };
  refreshPhone();
}
function closePhone() { PV.open = false; PV.app = null; PV.id = null; const ov = $(".phone-ov"); if (ov) ov.remove(); render(); }

function inBag(id) { return S.prep && S.prep.bag.includes(id); }
function expand(entries) {
  // 열린 잠금의 내용물을 펼친다
  const out = [];
  for (const e of entries) {
    out.push(e);
    if (e.lock && S.prep && S.prep.open[e.lock]) {
      const L = LOCKS[e.lock];
      (L.kind === "order" ? [{ item: L.result }] : L.contents).forEach(c => out.push(c));
    }
  }
  return out;
}
function entryHTML(e) {
  const J = curJudge();
  if (e.text) return `<div class="entry txt">${esc(e.text)}</div>`;
  if (e.action === "phone") return `<div class="entry"><span class="kind">폰</span><span class="et"><b>핸드폰 보기</b><small>메시지, 메일, 뉴스${S.ph.boardOn ? ", 게시판" : ""}</small></span><button class="eb" data-phone type="button">보기</button></div>`;
  if (e.doc) { const D = DOCS[e.doc]; return `<div class="entry"><span class="kind">문서</span><span class="et"><b>${esc(D.title)}</b>${S.seen[e.doc] ? "<small>읽음</small>" : ""}</span><button class="eb" data-doc="${e.doc}" type="button">읽기</button></div>`; }
  if (e.item) {
    const I = ITEMS[e.item], on = inBag(e.item);
    const btn = J ? `<button class="eb ${on ? "on" : ""}" data-item="${e.item}" type="button">${on ? "가방에서 빼기" : "가방에 넣기"}</button>` : `<span class="eb" style="opacity:.5">지금은 필요 없다</span>`;
    return `<div class="entry"><span class="kind">물건</span><span class="et"><b>${esc(I.n)}</b><small>${esc(I.d)}</small></span>${btn}</div>`;
  }
  if (e.lock) {
    const L = LOCKS[e.lock], open = S.prep && S.prep.open[e.lock];
    if (open) return `<div class="entry"><span class="kind">봉인</span><span class="et"><b>${esc(L.title)}</b><small>풀었다.</small></span></div>`;
    return `<div class="entry locked"><span class="kind">봉인</span><span class="et"><b>${esc(L.title)}</b><small>그 녀석이 걸어 둔 봉인.</small></span><button class="eb on" data-lock="${e.lock}" type="button">풀어 본다</button></div>`;
  }
  return "";
}

const COLORS = [["검정", "#111"], ["갈색", "#7a4a26"], ["빨강", "#c0392b"], ["주황", "#e67e22"], ["노랑", "#f1c40f"], ["초록", "#27ae60"], ["파랑", "#2c6fd1"], ["보라", "#8e44ad"], ["회색", "#8d8d8d"], ["흰색", "#f4f4f4"]];

<div class="cc">${COLORS.map((c, k) => `<div><i style="background:${c[1]}"></i>${c[0]} ${k}</div>`).join("")}</div>여백에 연필 글씨:
<span class="hi">다시는 이걸로 사람을 해치지 않는다.</span></div>`;

function drawOv() {
  const o = ovEl();
  let title, body, back = false;
  if (OV.view === "spot") { title = SPOT_LABEL(OV.spot); body = `<div class="entries">${expand(spotEntries(OV.spot)).map(entryHTML).join("")}</div>`; }
  else if (OV.view === "doc") { title = DOCS[OV.id].title; body = docHTML(OV.id); back = true; }

  bindOv(o);
}

function bindOv(o) {
  o.querySelectorAll("[data-x]").forEach(b => b.onclick = closeOv);
  o.querySelectorAll("[data-back]").forEach(b => b.onclick = () => { OV.view = "spot"; drawOv(); });
  o.querySelectorAll("[data-phone]").forEach(b => b.onclick = () => { OV = null; o.remove(); openPhone(); });
  o.querySelectorAll("[data-doc]").forEach(b => b.onclick = () => {
    const id = b.dataset.doc, first = !S.seen[id]; S.seen[id] = true; save();
    OV.view = "doc"; OV.id = id; drawOv();
    if (first && DOCS[id].voice) setTimeout(() => voice(DOCS[id].voice), 600);
  });
  o.querySelectorAll("[data-item]").forEach(b => b.onclick = () => toggleItem(b.dataset.item));
  o.querySelectorAll("[data-lock]").forEach(b => b.onclick = () => { OV.view = "lock"; OV.id = b.dataset.lock; OV.input = ""; OV.order = []; drawOv(); });
  o.querySelectorAll("[data-n]").forEach(b => b.onclick = () => padPress(b.dataset.n));
  const tl = $("#tl", o); if (tl) { tl.onsubmit = e => { e.preventDefault(); tryLock($("#tlin", o).value); }; setTimeout(() => $("#tlin", o).focus(), 50); }
  o.querySelectorAll("[data-piece]").forEach(b => b.onclick = () => {
    OV.order.push(+b.dataset.piece); SFX.click();
    const L = LOCKS[OV.id];
    if (OV.order.length === L.pieces.length) { if (OV.order.every((k, n) => k === n)) unlock(OV.id); else { SFX.wrong(); voice(WRONG[Math.floor(Math.random() * WRONG.length)]); toast("문장이 이어지지 않는다."); OV.order = []; drawOv(); } }
    else drawOv();

function padPress(n) {
  const L = LOCKS[OV.id]; SFX.click();
  if (n === "del") OV.input = OV.input.slice(0, -1);
  else if (n === "ok") { tryLock(OV.input); return; }
  else if (OV.input.length < L.len) OV.input += n;

}
document.addEventListener("keydown", e => {
  if (!OV || OV.view !== "lock" || LOCKS[OV.id].kind !== "digits") return;
  if (/^[0-9]$/.test(e.key)) padPress(e.key); else if (e.key === "Backspace") padPress("del"); else if (e.key === "Enter") padPress("ok");
});
function tryLock(v) {
  const L = LOCKS[OV.id], norm = String(v).trim().toLowerCase().replace(/\s+/g, "");
  if (norm === L.answer) { unlock(OV.id); return; }
  SFX.wrong();
  voice((L.special && L.special[norm]) || WRONG[Math.floor(Math.random() * WRONG.length)]);
  OV.input = ""; drawOv();
  const dg = $("#dg"); if (dg) dg.classList.add("bad");
}
function unlock(id) {
  const L = LOCKS[id]; S.prep.open[id] = true; save(); SFX.open();

  OV.view = "spot"; drawOv();
}
function toggleItem(id) {
  const J = curJudge(), bag = S.prep.bag;
  if (bag.includes(id)) bag.splice(bag.indexOf(id), 1);
  else { if (bag.length >= J.slots) { toast("가방이 가득 찼다. 무언가를 빼야 한다."); return; } bag.push(id); SFX.click(); }
  save(); drawOv();
}
function takeOut(id) { const bag = S.prep.bag; bag.splice(bag.indexOf(id), 1); save(); renderRoom(); }

/* ---------- 진행 ---------- */
function render() {
  const st = SCRIPT[S.step];
  $("#notif").innerHTML = "";
  if (st.type === "title") return renderTitle();
  if (st.type === "phone") { $("#app").innerHTML = topHTML() + `<div class="phone-stage">${phoneHTML(true)}</div>`; bindTop(); bindPhone($(".phone-stage"), true); return; }
  if (st.type === "room" || st.type === "judge") { if (S.phase === "scene") return renderScene(); return renderRoom(); }
  if (st.type === "narr") { $("#app").innerHTML = ""; return; }
}
function enterStep() {
  const st = SCRIPT[S.step];
  S.batch = 0; S.phase = null; PV.app = null; PV.id = null;
  if (st.t) S.time = st.t;
  if (st.name) S.name = st.name;
  if (st.stage != null) S.stage = st.stage;
  if (st.type === "judge") {
    const J = JUDGE[st.j]; S.time = J.t; S.stage = J.stage; S.name = "심판자";
    S.prep = { j: st.j, bag: [], open: {} };
    store(CP_KEY, S);
  }
  save(); render();
  if (st.type === "narr") showNarr(st.lines, next);
  if (st.type === "final") runFinal();
  if (st.type === "end") runEnd();
}
function next() { S.step++; enterStep(); }
function advanceBatch() {
  const st = SCRIPT[S.step];
  if (S.batch >= st.batches.length) return;
  const b = st.batches[S.batch++];
  deliver(b, () => { if (SCRIPT[S.step].type === "phone") refreshPhone(); else if (!PV.open) renderRoom(); else refreshPhone(); const tb = $("#tb-phone"); if (tb) tb.classList.add("buzz"); });
}
function stepDone() { PV.open = false; const ov = $(".phone-ov"); if (ov) ov.remove(); next(); }

function renderTitle() {
  const has = fetchSaved(SAVE_KEY);
  $("#app").innerHTML = `<div class="title-screen"><div class="title-bg">${titleSVG()}</div><h1>물때<span>2</span></h1><p class="sub">죗값</p><p class="period">202×년 7월 14일 ~ 9월 15일</p>
    <div class="stack"><button class="btn red" id="new" type="button">처음부터</button><button class="btn" id="cont" type="button" ${has && has.step > 0 ? "" : "disabled"}>이어하기</button><button class="btn" id="slots" type="button" ${anySlot() ? "" : "disabled"}>저장 슬롯에서 불러오기</button></div>
    <p class="tip">「물때」의 4년 뒤 이야기입니다. 1편을 먼저 하면 더 많은 것이 보입니다.<br>진행은 이 브라우저에 자동 저장됩니다. 소리가 납니다.<br>위험한 장면은 직접 보여 주지 않고 돌려서 표현합니다.</p></div>`;
  $("#new").onclick = () => { audio(); S = newState(); next(); };
  $("#slots").onclick = () => { audio(); openSlots(false); };
  $("#cont").onclick = () => { audio(); const sv = fetchSaved(SAVE_KEY); if (!sv) return; S = sv; resume(); };
}
function resume() {
  const st = SCRIPT[S.step];
  if (st.type === "narr") { render(); showNarr(st.lines, next); return; }
  if (st.type === "final" || st.type === "end") { enterStep(); return; }
  if (st.type === "judge" && S.phase === "scene") S.phase = null;
  render();
}
function openLog() {
  const o = ovEl(); OV = { view: "log" };
  o.innerHTML = `<div class="card"><h3>속마음<button class="x" data-x type="button">닫기</button></h3><p class="desc">지나간 목소리들. 푸른 글씨는 그 녀석, 붉은 글씨는 나.</p><div class="vlog">${S.voiceLog.slice().reverse().map(v => `<div class="${voiceKind(v.s)}"><small>${fmtShort(v.t)}</small>${esc(voiceText(v.s))}</div>`).join("") || `<p class="desc">아직 없다.</p>`}</div></div>`;
  o.querySelector("[data-x]").onclick = () => { OV = null; o.remove(); };
}
function openMenu() {

  o.innerHTML = `<div class="card"><h3>메뉴<button class="x" data-x type="button">닫기</button></h3><div class="entries">
    ${J ? `<div class="entry"><span class="et"><b>이 심판 준비를 처음부터</b><small>가방과 봉인이 처음 상태로 돌아간다.</small></span><button class="eb" id="m-cp" type="button">다시</button></div>` : ""}
    <div class="entry"><span class="et"><b>저장 슬롯</b><small>지금 시점을 저장하거나, 저장한 시점으로 돌아간다.</small></span><button class="eb" id="m-slots" type="button">열기</button></div>
    <div class="entry"><span class="et"><b>타이틀로</b><small>진행은 저장되어 있다.</small></span><button class="eb" id="m-title" type="button">이동</button></div></div></div>`;

/* ---------- 출발과 현장 ---------- */
function confirmGo() {
  const J = curJudge(), bag = S.prep.bag;

  o.innerHTML = `<div class="card"><h3>나간다<button class="x" data-x type="button">닫기</button></h3>

function renderScene() {
  const st = SCRIPT[S.step];

    ${isFinal ? "" : `<div class="bagline">가방: ${S.prep.bag.map(id => esc(ITEMS[id].n)).join(" · ") || "비어 있음"}</div>`}</div>`;
  if (isFinal) return;

  setTimeout(() => placeJudgeButton(INTERFERE[SCRIPT[S.step].j] || [], () => judgeSuccess(J), st.j === 4 ? "-네가 못 낸 답, 내가 내줄게." : null), 1200);
}
/* 첫 번째 인격이 끼어든다: 버튼이 흔들리거나 사라졌다 다른 곳에 나타난다 */
function placeJudgeButton(lines, onPress, finalLine) {
  const sc = $("#sc"); if (!sc) return;
  const b = document.createElement("button");
  b.type = "button"; b.className = "judge-btn"; b.textContent = "심판한다";
  sc.appendChild(b);
  let n = 0;
  const quake = ms => { sc.classList.remove("quake"); void sc.offsetWidth; sc.classList.add("quake"); clearTimeout(sc.qh); sc.qh = setTimeout(() => sc.classList.remove("quake"), ms); try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
  if (lines.length === 1) { b.classList.add("shake"); quake(1600); voice(lines[0]); setTimeout(() => b.classList.remove("shake"), 1600); }
  b.onclick = () => {
    if (lines.length > 1 && n < lines.length) {
      voice(lines[n++]); SFX.wrong(); b.classList.add("shake"); quake(700);
      setTimeout(() => { b.classList.remove("shake"); b.classList.add("gone"); }, 450);
      setTimeout(() => { b.style.left = (18 + Math.random() * 64) + "%"; b.style.top = (30 + Math.random() * 48) + "%"; b.classList.remove("gone"); }, 1300);
      if (n === lines.length && finalLine) setTimeout(() => voice(finalLine), 1300);
      return;
    }
    b.disabled = true; onPress();
  };
}
function judgeSuccess(J) {
  const lines = J.success.concat([{ phrase: J.phrase }, { verdict: J.verdict }]);
  showNarr(lines, () => { S.prep = null; S.phase = null; next(); });
}
function failJudge(kind) {
  showNarr([FAIL_REASON[kind]].concat(FAIL.lines), () => {
    showEndCard(`<div class="lastline red">${esc(FAIL.last)}</div>`, [
      { label: "이 심판의 준비로 돌아가기", red: true, fn: restoreCheckpoint },
      { label: "타이틀로", fn: () => { const cp = fetchSaved(CP_KEY); if (cp) store(SAVE_KEY, cp); S = newState(); renderTitle(); } }
    ]);
  }, { keep: true });
}

/* ---------- 저장 슬롯 3개 (이 브라우저에 저장) ---------- */
const SLOT_KEY = k => "muldae2_slot" + k;

function slotLabel(sv) {
  const st = SCRIPT[sv.S.step] || {};
  const where = st.type === "judge" ? JUDGE[st.j].label + " 준비 중" : st.type === "phone" ? "출소 직후 (핸드폰)" : st.type === "room" ? "원룸" : "진행 중";
  return `${fmtDate(sv.S.time)} ${fmtClock(sv.S.time)} · ${where}`;
}
function openSlots(canSave) {
  const o = ovEl(); OV = { view: "slots", confirm: null };
  const draw = () => {
    const rows = [1, 2, 3].map(k => {
      const sv = fetchSaved(SLOT_KEY(k));
      const saveBtn = canSave ? `<button class="eb ${OV.confirm === k ? "on" : ""}" data-save="${k}" type="button">${OV.confirm === k ? "덮어쓰기" : "저장"}</button>` : "";
      const loadBtn = sv ? `<button class="eb" data-load="${k}" type="button">불러오기</button>` : "";
      return `<div class="entry"><span class="kind">${k}</span><span class="et"><b>${sv ? esc(slotLabel(sv)) : "비어 있음"}</b>${sv ? `<small>저장한 때: ${esc(sv.at)}</small>` : ""}</span>${saveBtn}${loadBtn}</div>`;
    }).join("");
    o.innerHTML = `<div class="card"><h3>저장 슬롯<button class="x" data-x type="button">닫기</button></h3>
      <p class="desc">${canSave ? "지금 시점을 슬롯에 저장하거나, 저장해 둔 시점으로 돌아간다." : "저장해 둔 시점으로 돌아간다."} 저장은 이 브라우저에만 남는다.</p>
      <div class="entries">${rows}</div>${OV.confirm ? `<p class="desc" style="margin-top:12px">이미 저장된 슬롯이다. 한 번 더 누르면 덮어쓴다.</p>` : ""}</div>`;
    o.querySelector("[data-x]").onclick = () => { OV = null; o.remove(); };
    o.querySelectorAll("[data-save]").forEach(b => b.onclick = () => {
      const k = +b.dataset.save;
      if (fetchSaved(SLOT_KEY(k)) && OV.confirm !== k) { OV.confirm = k; draw(); return; }
      const now = new Date();
      store(SLOT_KEY(k), { S: clone(S), cp: fetchSaved(CP_KEY), at: `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}` });
      OV.confirm = null; SFX.open(); toast(`슬롯 ${k}에 저장했다.`); draw();
    });
    o.querySelectorAll("[data-load]").forEach(b => b.onclick = () => {
      const sv = fetchSaved(SLOT_KEY(+b.dataset.load)); if (!sv) return;
      OV = null; o.remove(); PV.open = false; const pov = $(".phone-ov"); if (pov) pov.remove();
      S = clone(sv.S); S.phase = null; if (sv.cp) store(CP_KEY, sv.cp);
      save(); toast(`슬롯 ${b.dataset.load}을 불러왔다.`); resume();
    });
  };
  draw();
}

/* ---------- 마지막 판결과 엔딩 ---------- */
function runFinal() {
  S.stage = 5; save();
  showNarr(FINAL.pre, () => {
    renderScene();
    showNarr(FINAL.mirror, () => {
      placeJudgeButton([], () => {
        showNarr([{ blackout: true }, { verdict: FINAL.verdict }], next);
      });
    });
  });
}
function runEnd() {
  try { localStorage.removeItem(CP_KEY); } catch (e) {}
  showNarr(FINAL.ending.concat([{ title: "심판자의 탄생", small: "진엔딩" }]), () => {
    showEndCard(`<div class="ln date" style="text-align:center">뉴스 · 앵커 음성</div><div class="lastline red">「${esc(FINAL.last)}」</div>`, [
      { label: "타이틀로", fn: () => { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} S = newState(); renderTitle(); } }
    ]);
  }, { keep: true });
}

/* 시작 */
window.__game = { get S() { return S; }, jump(i) { S.step = i; enterStep(); }, SCRIPT, JUDGE, LOCKS };
render();

</script>
</body></html>
